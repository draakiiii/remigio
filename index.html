<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Partidas de Remigio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Gestor de Partidas de Remigio</h1>
        <div class="header-controls">
            <button id="darkModeToggle" class="btn icon-btn" aria-label="Cambiar modo claro/oscuro"><i class="fas fa-moon"></i></button>
            <button id="settingsButton" class="btn icon-btn settings-btn" aria-label="Configuraci\u00f3n API"><i class="fas fa-cog"></i></button>
        </div>
        <div id="home" class="button-group">
            <button id="newGameButton" class="btn"><i class="fas fa-plus"></i> Nueva Partida</button>
            <button id="continueGameButton" class="btn" style="display: none;"><i class="fas fa-play"></i> Continuar Partida</button>
            <button id="historyButton" class="btn"><i class="fas fa-history"></i> Historial</button>
            <button id="rankingButton" class="btn"><i class="fas fa-trophy"></i> Ranking</button>
            <button id="statsButton" class="btn"><i class="fas fa-chart-line"></i> Estadísticas</button>
            <button id="achievementsButton" class="btn"><i class="fas fa-medal"></i> Logros</button>
            <button id="compareButton" class="btn"><i class="fas fa-users-cog"></i> Comparar Jugadores</button>
        </div>
        <div id="newGame" class="form-container" style="display: none;">
            <form id="gameForm">
                <div class="input-group">
                    <label for="date"><i class="fas fa-calendar"></i> Fecha:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="input-group">
                    <label for="players"><i class="fas fa-users"></i> Jugadores (separados por comas):</label>
                    <input type="text" id="players" placeholder="Ej: Juan, María, Pedro" required>
                </div>
                <div class="input-group">
                    <label for="maxPoints"><i class="fas fa-star"></i> Puntuación Máxima:</label>
                    <input type="number" id="maxPoints" value="150" min="50" max="500" placeholder="150" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-play"></i> Iniciar Partida</button>
            </form>
        </div>
        <div id="gameContainer" style="display: none;">
        </div>
        <div id="historyContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-history"></i> Historial de Partidas</h2>
                <button class="btn back-btn" id="historyBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div id="historyList"></div>
        </div>
        <div id="rankingContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-trophy"></i> Ranking de Jugadores</h2>
                <button class="btn back-btn" id="rankingBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div id="rankingList"></div>
        </div>
        <div id="statsContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-chart-line"></i> Estadísticas Avanzadas</h2>
                <button class="btn back-btn" id="statsBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div id="statsList"></div>
        </div>
        <div id="achievementsContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-medal"></i> Logros Desbloqueados</h2>
                <button class="btn back-btn" id="achievementsBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div id="achievementsList"></div>
        </div>
        <div id="compareContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-users-cog"></i> Comparar Jugadores</h2>
                <button class="btn back-btn" id="compareBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div class="compare-selector">
                <select id="player1Select" class="player-select">
                    <option value="">Selecciona Jugador 1</option>
                </select>
                <span class="vs-text">VS</span>
                <select id="player2Select" class="player-select">
                    <option value="">Selecciona Jugador 2</option>
                </select>
            </div>
            <div id="compareResults"></div>
        </div>
        <div id="gameDetailContainer" class="animate__animated" style="display: none;">
            <div class="section-header">
                <h2><i class="fas fa-chart-area"></i> Detalle de Partida</h2>
                <button class="btn back-btn" id="gameDetailBackBtn"><i class="fas fa-arrow-left"></i> Volver</button>
            </div>
            <div id="gameDetailContent"></div>
        </div>
        <div id="pastGames" style="display: none;"></div>
        <div id="apiKeyModal" class="modal" style="display:none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-cog"></i> Configuración de OpenAI</h2>
                    <button class="close" aria-label="Cerrar">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label for="apiKeyInput"><i class="fas fa-key"></i> API Key de OpenAI:</label>
                        <input type="password" id="apiKeyInput" placeholder="sk-...">
                    </div>
                    <div class="input-group">
                        <label for="modelSelect"><i class="fas fa-brain"></i> Modelo:</label>
                        <select id="modelSelect">
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Más rápido)</option>
                            <option value="gpt-4o">GPT-4o (Recomendado)</option>
                            <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="aiPromptInput"><i class="fas fa-comment"></i> Tipo de mensaje:</label>
                        <input type="text" id="aiPromptInput" placeholder="Ej: informativo, gracioso, sarcástico...">
                        <small class="help-text">Personaliza el estilo de los comentarios de la IA</small>
                    </div>
                    <button id="saveApiKeyButton" class="btn primary-btn"><i class="fas fa-save"></i> Guardar Configuración</button>
                </div>
            </div>
        </div>
        <div id="dataModal" class="modal" style="display:none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-database"></i> Gestión de Datos</h2>
                    <button class="close-data" aria-label="Cerrar">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="data-actions">
                        <button id="exportDataButton" class="btn primary-btn full-width">
                            <i class="fas fa-download"></i> Exportar Todos los Datos
                        </button>
                        <button id="importDataButton" class="btn secondary-btn full-width">
                            <i class="fas fa-upload"></i> Importar Datos
                        </button>
                        <input type="file" id="importFileInput" accept=".json" style="display: none;">
                    </div>
                </div>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
